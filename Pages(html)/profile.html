<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Life Organizer - Profile</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


    <div class="profile-container">

        <h1>My Profile</h1>

        <p>Manage your personal information</p>


        <div class="profile-card">


            <!-- Profile Icon -->

            <div class="profile-icon">
                👤
            </div>


            <!-- Name -->

            <h2 id="profileName">
                User Name
            </h2>


            <!-- Email -->

            <p id="profileEmail">
                user@email.com
            </p>


            <hr>


            <!-- Name Information -->

            <div class="profile-info">

                <strong>Name</strong>

                <span id="nameText">
                    -
                </span>

            </div>


            <!-- Email Information -->

            <div class="profile-info">

                <strong>Email</strong>

                <span id="emailText">
                    -
                </span>

            </div>


            <br>


            <!-- Edit Profile -->

            <button
                type="button"
                onclick="editProfile()"
            >
                ✏️ Edit Profile
            </button>


            <br><br>


            <!-- Change Password -->

            <button
                type="button"
                onclick="changePassword()"
            >
                🔐 Change Password
            </button>


            <br><br>


            <!-- Back -->

            <button
                type="button"
                onclick="goBack()"
            >
                ← Back to Dashboard
            </button>


            <br><br>


            <!-- Logout -->

            <button
                type="button"
                onclick="logout()"
            >
                Logout
            </button>


        </div>

    </div>



    <script>


        // =====================================
        // LOGIN CHECK
        // =====================================

        const loggedIn =
            localStorage.getItem("loggedIn");


        if (loggedIn !== "true") {

            window.location.href =
                "login.html";

        }


        // =====================================
        // CURRENT USER
        // =====================================

        let userName =
            localStorage.getItem("userName");


        let userEmail =
            localStorage.getItem("userEmail");



        // =====================================
        // SHOW USER INFORMATION
        // =====================================

        function showUserInfo() {

            if (userName) {

                document.getElementById(
                    "profileName"
                ).textContent = userName;


                document.getElementById(
                    "nameText"
                ).textContent = userName;

            }


            if (userEmail) {

                document.getElementById(
                    "profileEmail"
                ).textContent = userEmail;


                document.getElementById(
                    "emailText"
                ).textContent = userEmail;

            }

        }


        showUserInfo();



        // =====================================
        // EDIT PROFILE
        // =====================================

        async function editProfile() {

            const newName =
                prompt(
                    "Enter your new name:",
                    userName
                );


            if (newName === null) {
                return;
            }


            const newEmail =
                prompt(
                    "Enter your new email:",
                    userEmail
                );


            if (newEmail === null) {
                return;
            }


            if (
                newName.trim() === "" ||
                newEmail.trim() === ""
            ) {

                alert(
                    "Name and email cannot be empty."
                );

                return;

            }


            const users =
                await window.electronAPI.getUsers();


            const emailExists =
                users.some(function(user) {

                    return (
                        user.email.toLowerCase()
                        ===
                        newEmail.trim().toLowerCase()

                        &&

                        user.email.toLowerCase()
                        !==
                        userEmail.toLowerCase()
                    );

                });


            if (emailExists) {

                alert(
                    "This email is already used by another account."
                );

                return;

            }


            const currentUser =
                users.find(function(user) {

                    return (
                        user.email.toLowerCase()
                        ===
                        userEmail.toLowerCase()
                    );

                });


            if (!currentUser) {

                alert("User not found.");

                return;

            }


            const updatedUser = {

                name: newName.trim(),

                email: newEmail.trim(),

                password: currentUser.password

            };


            const success =
                await window.electronAPI.updateUser(
                    userEmail,
                    updatedUser
                );


            if (success) {

                localStorage.setItem(
                    "userName",
                    updatedUser.name
                );


                localStorage.setItem(
                    "userEmail",
                    updatedUser.email
                );


                userName =
                    updatedUser.name;


                userEmail =
                    updatedUser.email;


                showUserInfo();


                alert(
                    "Profile updated successfully!"
                );

            }

            else {

                alert(
                    "Profile update failed."
                );

            }

        }



        // =====================================
        // CHANGE PASSWORD
        // =====================================

        async function changePassword() {

            const currentPassword =
                prompt(
                    "Enter your current password:"
                );


            if (currentPassword === null) {
                return;
            }


            const newPassword =
                prompt(
                    "Enter your new password:"
                );


            if (newPassword === null) {
                return;
            }


            const confirmPassword =
                prompt(
                    "Confirm your new password:"
                );


            if (confirmPassword === null) {
                return;
            }


            // Empty check

            if (
                currentPassword.trim() === "" ||
                newPassword.trim() === "" ||
                confirmPassword.trim() === ""
            ) {

                alert(
                    "Password cannot be empty."
                );

                return;

            }


            // Password match

            if (
                newPassword !==
                confirmPassword
            ) {

                alert(
                    "New passwords do not match."
                );

                return;

            }


            // Get users

            const users =
                await window.electronAPI.getUsers();


            // Find current user

            const currentUser =
                users.find(function(user) {

                    return (
                        user.email.toLowerCase()
                        ===
                        userEmail.toLowerCase()
                    );

                });


            if (!currentUser) {

                alert("User not found.");

                return;

            }


            // Check old password

            if (
                currentUser.password !==
                currentPassword
            ) {

                alert(
                    "Current password is incorrect."
                );

                return;

            }


            // New user data

            const updatedUser = {

                name: currentUser.name,

                email: currentUser.email,

                password: newPassword

            };


            // Save

            const success =
                await window.electronAPI.updateUser(
                    currentUser.email,
                    updatedUser
                );


            if (success) {

                alert(
                    "Password changed successfully!"
                );

            }

            else {

                alert(
                    "Password change failed."
                );

            }

        }



        // =====================================
        // BACK TO DASHBOARD
        // =====================================

        function goBack() {

            window.location.href =
                "dashboard.html";

        }



        // =====================================
        // LOGOUT
        // =====================================

        function logout() {

            localStorage.removeItem(
                "loggedIn"
            );


            localStorage.removeItem(
                "userName"
            );


            localStorage.removeItem(
                "userEmail"
            );


            window.location.href =
                "login.html";

        }


    </script>


</body>

</html>
