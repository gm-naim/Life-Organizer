<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Life Organizer - Profile</title>

    <link rel="stylesheet"
          href="../css/style.css">

</head>


<body>

    <div class="profile-container">

        <h1>My Profile</h1>

        <p>Manage your personal information</p>


        <!-- Profile Card -->

        <div class="profile-card">

            <div class="profile-icon">
                👤
            </div>


            <h2 id="profileName">
                User Name
            </h2>


            <p id="profileEmail">
                user@email.com
            </p>


            <hr>


            <!-- Name -->

            <div class="profile-info">

                <strong>Name</strong>

                <span id="nameText">
                    -
                </span>

            </div>


            <!-- Email -->

            <div class="profile-info">

                <strong>Email</strong>

                <span id="emailText">
                    -
                </span>

            </div>


            <br>


            <button
                type="button"
                onclick="goBack()"
            >
                ← Back to Dashboard
            </button>


            <button
                type="button"
                onclick="logout()"
            >
                Logout
            </button>

        </div>

    </div>


    <script>

        // =========================
        // LOGIN CHECK
        // =========================

        const loggedIn =
            localStorage.getItem("loggedIn");


        if (loggedIn !== "true") {

            window.location.href =
                "login.html";

        }


        // =========================
        // GET USER INFORMATION
        // =========================

        const userName =
            localStorage.getItem("userName");

        const userEmail =
            localStorage.getItem("userEmail");


        // Show name

        if (userName) {

            document.getElementById(
                "profileName"
            ).textContent = userName;

            document.getElementById(
                "nameText"
            ).textContent = userName;

        }


        // Show email

        if (userEmail) {

            document.getElementById(
                "profileEmail"
            ).textContent = userEmail;

            document.getElementById(
                "emailText"
            ).textContent = userEmail;

        }


        // =========================
        // BACK TO DASHBOARD
        // =========================

        function goBack() {

            window.location.href =
                "dashboard.html";

        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem(
                "loggedIn"
            );

            localStorage.removeItem(
                "userName"
            );

            localStorage.removeItem(
                "userEmail"
            );


            window.location.href =
                "login.html";

        }

    </script>

</body>

</html>
