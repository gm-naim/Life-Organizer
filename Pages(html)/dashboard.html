<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life Organizer - Dashboard</title>

    <link rel="stylesheet" href="../css/style.css">

</head>


<body>

    <div class="dashboard">

        <h1>Life Organizer</h1>

        <h2 id="welcomeName">
            Welcome!
        </h2>

        <p>
            Keep Everything That Matters
        </p>


        <!-- Dashboard Cards -->

        <div class="dashboard-cards">

            <div class="card">

                <h3>📄 Documents</h3>

                <p>0</p>

            </div>


            <div class="card">

                <h3>🤝 Borrowed Items</h3>

                <p>0</p>

            </div>


            <div class="card">

                <h3>🧾 Warranty</h3>

                <p>0</p>

            </div>


            <div class="card">

                <h3>🔔 Reminders</h3>

                <p>0</p>

            </div>

        </div>


        <br><br>


        <!-- Logout Button -->

        <button
            type="button"
            onclick="logout()"
        >
            Logout
        </button>

    </div>


    <script>

        // =========================
        // LOGIN CHECK
        // =========================

        const loggedIn =
            localStorage.getItem("loggedIn");


        if (loggedIn !== "true") {

            window.location.href =
                "login.html";

        }


        // =========================
        // SHOW USER NAME
        // =========================

        const userName =
            localStorage.getItem("userName");


        if (userName) {

            document.getElementById(
                "welcomeName"
            ).textContent =
                "Welcome, " + userName + "!";

        }


        // =========================
        // LOGOUT
        // =========================

        function logout() {

            localStorage.removeItem(
                "loggedIn"
            );

            localStorage.removeItem(
                "userName"
            );

            localStorage.removeItem(
                "userEmail"
            );


            window.location.href =
                "login.html";

        }

    </script>

</body>

</html>
