<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <title>Dashboard - Life Organizer</title>

    <link
        rel="stylesheet"
        href="../css/style.css"
    >

</head>


<body>


<div class="dashboard">

    <h1>Welcome to Life Organizer</h1>


    <h2 id="welcomeName">
        Welcome!
    </h2>


    <p>
        Your personal organizer is ready.
    </p>


    <div class="dashboard-cards">

        <div class="card">
            <h3>📄 Documents</h3>
            <p>0</p>
        </div>


        <div class="card">
            <h3>🤝 Borrowed Items</h3>
            <p>0</p>
        </div>


        <div class="card">
            <h3>🧾 Warranty</h3>
            <p>0</p>
        </div>


        <div class="card">
            <h3>🔔 Reminders</h3>
            <p>0</p>
        </div>

    </div>


    <button id="logoutButton">
        Logout
    </button>

</div>


<script src="../js/auth.js"></script>

</body>

</html>
