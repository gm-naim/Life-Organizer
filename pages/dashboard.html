<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Organizer - Dashboard</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="documents.html">Documents</a>
    <a href="borrow-return.html">Borrow & Return</a>
    <a href="warranty.html">Warranty</a>
    <a href="reminders.html">Reminder</a>
    <a href="trash.html">Trash</a>
    <a href="settings.html">Settings</a>
    <a href="#" onclick="logout()">Logout</a>
</div>

<div class="container">

    <div class="dashboard-header">
        <div>
            <h1>Dashboard</h1>
            <p id="welcome"></p>
        </div>
    </div>

    <div class="grid">
        <div class="stat">
            <h3>Documents</h3>
            <h2 id="documentCount">0</h2>
        </div>

        <div class="stat">
            <h3>Borrowed Items</h3>
            <h2 id="borrowCount">0</h2>
        </div>

        <div class="stat">
            <h3>Pending Returns</h3>
            <h2 id="pendingCount">0</h2>
        </div>

        <div class="stat">
            <h3>Products</h3>
            <h2 id="productCount">0</h2>
        </div>

        <div class="stat">
            <h3>Reminders</h3>
            <h2 id="reminderCount">0</h2>
        </div>
    </div>

    <div class="card">
        <h2>Quick Actions</h2>
        <button onclick="goTo('documents.html')">Add Document</button>
        <button onclick="goTo('borrow-return.html')">Add Borrow Item</button>
        <button onclick="goTo('warranty.html')">Add Warranty</button>
        <button onclick="goTo('reminders.html')">Add Reminder</button>
    </div>

</div>

<script src="../js/common.js"></script>
<script src="../js/dashboard.js"></script>
</body>
</html>
