<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Life Organizer - Login</title>

    <link rel="stylesheet" href="../css/style.css">

</head>

<body>

    <div class="auth-container">

        <div class="auth-box">

            <h1>Life Organizer</h1>

            <p>Welcome back</p>

            <form id="loginForm">

                <input
                    type="email"
                    id="loginEmail"
                    placeholder="Email"
                    required
                >

                <input
                    type="password"
                    id="loginPassword"
                    placeholder="Password"
                    required
                >

                <button type="submit">
                    Login
                </button>

            </form>

            <p id="message"></p>

            <p>
                Don't have an account?
                <a href="signup.html">Create Account</a>
            </p>

        </div>

    </div>

    <script src="../js/auth.js"></script>

</body>

</html>
