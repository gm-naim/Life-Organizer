<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Life Organizer - Documents</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/responsive.css">
</head>
<body>

<div class="nav">
    <a href="dashboard.html">Dashboard</a>
    <a href="profile.html">Profile</a>
    <a href="documents.html">Documents</a>
    <a href="borrow-return.html">Borrow & Return</a>

    <a href="trash.html">Trash</a>

<div class="container">

    <h1>Document Manager</h1>

    <div class="card">
        <h2>Add Document</h2>

        <label>Document Name</label>
        <input id="docName" placeholder="Passport">

        <label>Category</label>
        <input id="docCategory" placeholder="Personal">

        <label>Storage Location</label>
        <input id="docLocation" placeholder="Locker">

        <label>Expiry Date</label>
        <input id="docExpiry" type="date">

        <button onclick="addDocument()">Save Document</button>
    </div>

    <div class="card">
        <h2>Search</h2>
        <input id="search" oninput="searchDocuments()" placeholder="Search documents">
    </div>

    <div id="documentList"></div>

</div>

<script src="../js/common.js"></script>
<script src="../js/documents.js"></script>
</body>
</html>
